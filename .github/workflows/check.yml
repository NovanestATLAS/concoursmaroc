# Vérifie à chaque push que le site est cohérent : liens internes, SEO de base,
# banques de questions, et que docs/ correspond bien aux sources (npm run build).
# Construit aussi le www/ de l'application Android, qui refuse tout lien cassé.
name: Vérification du site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run check
      - run: npm run build:app
