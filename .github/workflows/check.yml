# Vérifie à chaque push que le site est cohérent : liens internes, SEO de base,
# banques de questions, et que docs/ correspond bien aux sources (npm run build).
name: Vérification du site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
